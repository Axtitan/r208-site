<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>App preview — R208 Technologies</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0B0B0A">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 16px;box-sizing:border-box;background:radial-gradient(ellipse at 50% 40%,#1a1a18 0%,#0B0B0A 70%)}
.solo .ap-fit{max-width:none;width:min(426px,calc((100dvh - 96px) * 426 / 898),calc(100vw - 32px))}
.solo-note{font:500 12px/1.4 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--steel);text-align:center}
.solo-missing{display:none;color:var(--paper);text-align:center}
.solo.is-missing .ap-fit,.solo.is-missing+.solo-note{display:none}
.solo.is-missing .solo-missing{display:block}
</style>
</head>
<body>
<!-- Keep this phone in step with phoneFrame() in src/lib/render.ts -->

<div class="ap-screen ap-screen--phone">
